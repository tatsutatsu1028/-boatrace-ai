# アプリ全体の配色テーマ「ナイトレース」（管理者・スタッフ共通）。
# 深い紺のダーク背景 × シグナルオレンジ。文字は背景とのコントラスト比 WCAG AA 以上。
# 細かい装飾（カード・ボタンの形・見出しのライン等）は app_core.py 冒頭のCSSで指定する。
[theme]
base = "dark"
primaryColor = "#FF7A1A"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#142036"
textColor = "#F1F5F9"
font = "sans-serif"
# 以下は Streamlit 1.46 以降で有効（古い版では無視されるだけ）。
linkColor = "#38BDF8"
borderColor = "#2A3A57"
showWidgetBorder = true
baseRadius = "12px"
baseFontSize = 16
