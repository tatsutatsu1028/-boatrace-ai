name: Random Auto Fix

on:
  workflow_dispatch:
  schedule:
    # GitHub Actionsのscheduleトリガーはtimezoneフィールドを解釈せず常にUTCで
    # 評価される（指定しても無視される）。JST 8:00〜20:45の間15,45分に実行する
    # ため、9時間分ずらしたUTC 23:00（前日）〜11:45で指定する
    # （UTC日付をまたぐため2行に分割）。
    - cron: "15,45 0-11 * * *"
    - cron: "15,45 23 * * *"

concurrency:
  group: random-auto-fix
  cancel-in-progress: false

jobs:
  auto-random-fix:
    runs-on: ubuntu-latest
    # 候補探索が長引いても concurrency グループを長時間占有し続けないよう、
    # 次回のcron発火（30分後）を大きく超える前にタイムアウトさせる。
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run random auto fix
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python auto_random_fix.py
