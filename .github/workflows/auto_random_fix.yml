name: Random Auto Fix

on:
  workflow_dispatch:
  schedule:
    # GitHub Actionsのscheduleトリガーはtimezoneフィールドを解釈せず常にUTCで
    # 評価される（指定しても無視される）。JST 8:20〜20:50の間20,50分に実行する
    # ため、9時間分ずらしたUTC 23:20（前日）〜11:50で指定する
    # （UTC日付をまたぐため2行に分割）。
    # 毎時0/15/30/45分ちょうどはGitHub Actions全体でschedule実行が集中し
    # 遅延・欠落しやすいことが公式ドキュメントでも知られている（実際に本
    # ワークフローもこの分単位を使っていたため、直前のマージ後1時間半以上
    # schedule実行が一度も発火しない欠落が発生した）。refresh_schedule_status /
    # prefetch_scheduleと同様に、混雑時間帯を避けるため20,50分にずらす。
    - cron: "20,50 0-11 * * *"
    - cron: "20,50 23 * * *"

concurrency:
  group: random-auto-fix
  cancel-in-progress: false

jobs:
  auto-random-fix:
    runs-on: ubuntu-latest
    # 候補探索が長引いても concurrency グループを長時間占有し続けないよう、
    # 次回のcron発火（30分後）を大きく超える前にタイムアウトさせる。
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run random auto fix
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python auto_random_fix.py
