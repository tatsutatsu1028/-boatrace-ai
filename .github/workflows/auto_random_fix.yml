name: Random Auto Fix

on:
  # 起動は Supabase の pg_cron から workflow_dispatch で行う
  # （supabase/migrations/20261001000000_trigger_auto_fix_and_collect_history_via_pg_cron.sql）。
  # JST 8:20〜20:50 の毎時20分・50分（30分おき）。
  # 以前は GitHub Actions の schedule で起動していたが、数時間単位の遅延・欠落が
  # 続いた（本来1日26回のところ、9/28〜10/1朝の約3日で11回しか起動しなかった）ため pg_cron に一本化した。
  # schedule を残すと pg_cron と同じ時刻に二重起動しうるので置かない。
  # 重複して起動しても auto_random_fix.py 側の _snapshot_exists で同じレースは二重に固定しない。
  workflow_dispatch:

jobs:
  auto-random-fix:
    runs-on: ubuntu-latest
    # 候補探索が長引いても次回のcron発火（30分後）を大きく超えて居座らない
    # よう、タイムアウトさせる（concurrencyブロックはschedule実行の発火
    # 自体を大幅に間引く不具合があったため削除。重複実行はauto_random_fix.py
    # 側のSupabase _snapshot_exists チェックで防止する）。
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 学習・過去データは非公開リポジトリにある（公式データを公開リポジトリで
      # 再配布しないため）。_data/ に取り出し、BOATRACE_DATA_DIR で各スクリプトへ渡す。
      - name: Checkout data (private)
        uses: actions/checkout@v4
        with:
          repository: tatsutatsu1028/-boatrace-ai-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: _data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run random auto fix
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BOATRACE_DATA_DIR: ${{ github.workspace }}/_data
        run: python auto_random_fix.py
