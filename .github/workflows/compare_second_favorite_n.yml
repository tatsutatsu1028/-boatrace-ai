name: Cleanup second_favorite_n artifact

# 一回限り: 検証で出したアーティファクト（レース別CSV）を削除する。
on:
  push:
    branches:
      - claude/second-favorite-n-comparison-iw19xj
    paths:
      - .github/workflows/compare_second_favorite_n.yml

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/11255287503"
          echo "deleted"
