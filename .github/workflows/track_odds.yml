name: Track Odds

on:
  workflow_dispatch:
  schedule:
    # GitHub Actionsのscheduleトリガーはtimezoneフィールドを解釈せず常にUTCで
    # 評価される（指定しても無視される）。JST 8:00〜22:00の5分おきに実行する
    # ため、9時間分ずらしたUTC 23:00（前日）〜13:55で指定する
    # （UTC日付をまたぐため2行に分割）。
    - cron: "*/5 0-13 * * *"
    - cron: "*/5 23 * * *"

jobs:
  track-odds:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Track odds
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python track_odds.py
