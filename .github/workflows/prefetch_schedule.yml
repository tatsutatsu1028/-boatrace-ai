name: Prefetch Daily Schedule

on:
  workflow_dispatch:
  schedule:
    # GitHub Actionsのscheduleトリガーはtimezoneフィールドを解釈せず常にUTCで
    # 評価される（指定しても無視される）。JST 07:00 に実行するため、
    # 9時間分ずらしたUTC 22:00（前日）で指定する。
    # 毎時0分ちょうどはGitHub Actions全体でscheduleイベントが集中し、
    # 実行が数時間単位で遅延・欠落することがあるため（GitHub公式ドキュメント
    # も0/15/30/45分ちょうどを避けるよう推奨）、5分ずらして実行する。
    - cron: "5 22 * * *"

jobs:
  prefetch-schedule:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prefetch full schedule
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python schedule_prefetcher.py --mode full
