name: Prefetch Daily Schedule

on:
  workflow_dispatch:
  schedule:
    # GitHub Actionsのscheduleトリガーはtimezoneフィールドを解釈せず常にUTCで
    # 評価される（指定しても無視される）。JST 07:00 に実行するため、
    # 9時間分ずらしたUTC 22:00（前日）で指定する。
    - cron: "0 22 * * *"

jobs:
  prefetch-schedule:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prefetch full schedule
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python schedule_prefetcher.py --mode full
