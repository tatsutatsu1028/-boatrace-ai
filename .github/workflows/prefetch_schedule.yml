name: Prefetch Daily Schedule

on:
  workflow_dispatch:
    inputs:
      mode:
        # 手動実行は既定で全量取得し直す。Supabaseのpg_cronからの起動
        # （supabase/migrations/20260926011000_trigger_prefetch_schedule_via_pg_cron.sql）
        # は ensure を渡し、当日分が埋まっていれば何もしない。
        description: "full: 全量取得し直す / ensure: 当日分が未取得のときだけ取得"
        type: choice
        options:
          - full
          - ensure
        default: full
  schedule:
    # GitHub Actionsのscheduleトリガーはtimezoneフィールドを解釈せず常にUTCで
    # 評価される（指定しても無視される）。JST 07:00 に実行するため、
    # 9時間分ずらしたUTC 22:00（前日）で指定する。
    # 毎時0分ちょうどはGitHub Actions全体でscheduleイベントが集中し、
    # 実行が数時間単位で遅延・欠落することがあるため（GitHub公式ドキュメント
    # も0/15/30/45分ちょうどを避けるよう推奨）、5分ずらして実行する。
    #
    # 実績として、本リポジトリのschedule実行は数時間単位の遅延・欠落が常態化
    # している（9/21は9:09、9/22は9:43 JSTに発火、9/23は8:55時点で未発火）。
    # 1回だけのcronでは朝に間に合わないため、JST 6:05〜8:35の30分おき
    # （UTC 21:05〜23:35）に複数回チャンスを設ける。schedule実行は
    # --mode ensure で動き、既に当日分が埋まっていれば何もせず終了する。
    # さらに refresh_schedule_status（--mode status）も当日分が未取得なら
    # 全量取得へ切り替えるため、どちらかが先に発火した時点で埋まる。
    #
    # それでも欠落するため、同じ時刻にSupabaseのpg_cronからも
    # workflow_dispatch（inputs.mode=ensure）で起動している（track_odds.ymlと
    # 同じ仕組み）。このscheduleは保険として残す。
    - cron: "5,35 21-23 * * *"

jobs:
  prefetch-schedule:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prefetch full schedule
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # workflow_dispatchは inputs.mode に従う（手動実行の既定はfull、
          # pg_cronからはensure）。schedule実行は当日分が埋まっていれば
          # 何もしない（複数回のcronで重複取得しない）。
          PREFETCH_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'ensure' }}
        run: python schedule_prefetcher.py --mode "$PREFETCH_MODE"
