name: Auto Result Collect

on:
  workflow_dispatch:
  schedule:
    # JST 09:00-22:45 every 15 minutes (UTC 00:00-13:45)
    - cron: "*/15 0-13 * * *"

jobs:
  collect-auto-results:
    runs-on: ubuntu-latest
    # concurrencyブロックはschedule実行の発火自体を大幅に間引く不具合が
    # あったため削除（auto_random_fix.ymlと同じ問題を確認）。重複実行は
    # auto_result_collect.py側の_result_existsチェックと、race_keyを
    # on_conflictにしたupsertで防止する。長時間ハングした場合に次回発火を
    # 大きく超えて居座らないよう、タイムアウトを設定する。
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect completed auto snapshot results
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python auto_result_collect.py
