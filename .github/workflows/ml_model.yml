name: ML Model

# 新しい予想モデル（ml_model.py）の定期処理（ml_nightly.py）。
#   task=state: 前日までの集計表 models/ml_state.pkl.gz を作り直す（毎晩。数十秒）
#   task=train: 2年分で学習し直し models/<版>.joblib と models/latest.json を書く（毎週。数分）。
#               続けて展示前モデル（ml_pre.py。「🌅 展示前厳選10」用）も学習し直し models/pre_latest.json を書く
#   task=train_pre: 展示前モデルだけ学習し直す（手動用）
#   task=train_candidate: 候補の版（v3）を as_of の基準日ごとに学習する（手動用。カンマ区切りで複数可）。
#               models/latest.json は書き換えないので本番の予想は変わらない（事後予想で並べて比べる）
#   task=coverage: 学習データの期間と、選手×コースの決まり手の空きの割合を出すだけ（手動用。何も保存しない）
#   task=legacy: 今までのモデル（prediction.train）を学習し models/legacy_model.pkl.gz と
#               models/legacy_model.json を書く（手動用。task=state のときも state の後に毎晩作る）。
#               Streamlit アプリはこれを読むだけで、中では学習しない（CPU 制限で学習が終わらないため）
# どちらも保存先は非公開のデータ用リポジトリ（models/）。成果物（artifact）には残さない。
#
# 本番の予想を新しいモデルに切り替えたので、Supabase の pg_cron から起動する
# （supabase/migrations/20261015000100_trigger_ml_model_via_pg_cron.sql）:
#   state 毎日 05:05 JST（自動固定の前）、train 毎週月曜 06:10 JST。手動でも動かせる。

on:
  workflow_dispatch:
    inputs:
      task:
        description: "state（集計表＋今までのモデル）/ train（学習し直し）/ train_pre（展示前モデルだけ）/ legacy（今までのモデルだけ）/ train_candidate（候補の版。本番は変えない）"
        required: true
        default: "state"
      as_of:
        description: "基準日 (YYYYMMDD)。空なら今日（JST）。train_candidate はカンマ区切りで複数可"
        required: false
        default: ""

concurrency:
  group: ml-model
  cancel-in-progress: false

jobs:
  ml:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    # このリポジトリへは書き込まない（保存先は _data/ の非公開リポジトリ）
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout data (private)
        uses: actions/checkout@v4
        with:
          repository: tatsutatsu1028/-boatrace-ai-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: _data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # scikit-learn は requirements.txt と同じ版にする（今までのモデルの pickle をアプリが読むため）
      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml pandas==3.0.6 numpy==2.4.6 "$(grep -i '^scikit-learn' requirements.txt)" scipy joblib lhafile lightgbm

      # ログは誰でも見られるため、ml_nightly.py は日付・件数・所要時間・合否だけを出す。
      - name: Run
        if: inputs.task != 'legacy'
        env:
          BOATRACE_DATA_DIR: ${{ github.workspace }}/_data
        run: |
          ARGS="${{ inputs.task }}"
          if [ -n "${{ inputs.as_of }}" ]; then ARGS="$ARGS --as-of ${{ inputs.as_of }}"; fi
          python ml_nightly.py $ARGS

      # 今までのモデル（アプリ用）。失敗しても集計表の保存は止めない（最後の手順で失敗にする）
      - name: Legacy model
        id: legacy
        if: inputs.task == 'state' || inputs.task == 'legacy'
        continue-on-error: true
        env:
          BOATRACE_DATA_DIR: ${{ github.workspace }}/_data
        run: python ml_nightly.py legacy

      - name: Commit to data repository
        working-directory: _data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models
          git diff --staged --quiet && { echo "変更なし"; exit 0; }
          git commit -q -m "ml model: ${{ inputs.task }}"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase && git push -q; then echo "push完了"; exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          echo "pushに失敗"; exit 1

      - name: Fail if legacy model failed
        if: steps.legacy.outcome == 'failure'
        run: |
          echo "今までのモデルの保存に失敗しました（集計表は保存済み）"; exit 1
