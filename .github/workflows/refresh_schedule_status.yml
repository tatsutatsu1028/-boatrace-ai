name: Refresh Schedule Status

on:
  workflow_dispatch:
  schedule:
    # GitHub Actionsのscheduleトリガーはtimezoneフィールドを解釈せず常にUTCで
    # 評価される（指定しても無視される）。JST 8:00〜22:30 の30分おきにするため、
    # 9時間分ずらしたUTC 23:00（前日）〜13:30で指定する
    # （UTC日付をまたぐため2行に分割）。
    - cron: "*/30 0-13 * * *"
    - cron: "*/30 23 * * *"

jobs:
  refresh-schedule-status:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh schedule status only
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python schedule_prefetcher.py --mode status
